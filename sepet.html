<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><title>Sepetim | Gezi Platformu</title><link rel="stylesheet" href="legal.css"><style>.cart-item{border:1px solid #dfe6e2;border-radius:14px;padding:16px;margin:12px 0}.cart-top{display:flex;justify-content:space-between;gap:14px}.cart-title{font-weight:900}.cart-price{font-weight:900;white-space:nowrap}.cart-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.control label{display:block;font-size:12px;font-weight:900;margin-bottom:6px;color:#56635d}.control select{width:100%;min-height:46px;font-weight:800}.remove{background:#f5ecec;color:#8a2e2e;padding:9px 12px;margin-top:12px}.cart-total{margin-top:20px;padding:18px;border-radius:14px;background:#f3f8f5;display:flex;justify-content:space-between;font-size:19px;font-weight:900}.empty{text-align:center;padding:35px 10px;color:#66716b}.checkout{width:100%;margin-top:14px;font-size:16px}.age-note{margin-top:12px;padding:11px;border-radius:10px;background:#f7f9f8;font-size:12px;line-height:1.5;color:#56635d}@media(max-width:520px){.cart-controls{grid-template-columns:1fr}}</style></head><body><header class="legal-header"><div class="legal-header-inner"><a class="legal-brand" href="/">Gezi Platformu</a><a class="legal-home" href="/">← Turlara Dön</a></div></header><main class="legal-wrap"><h1>Sepetim</h1><p class="muted">Tur tarihini ve toplam yolcu sayısını seçin. Yetişkin/çocuk ayrımını bir sonraki rezervasyon adımında her yolcu için ayrı ayrı belirleyeceksiniz.</p><div id="cart"></div></main><script src="tours.js"></script><script src="tours-extra.js"></script><script src="app.js"></script><script src="tour-policy.js"></script><script>const all=[...(window.TOURS||[])],params=new URLSearchParams(location.search);let cart=[];try{const parsed=JSON.parse(localStorage.getItem('gp_cart')||'[]');cart=Array.isArray(parsed)?parsed:[]}catch{cart=[]}cart=cart.map(c=>({...c,count:Number.isFinite(Number(c.count))&&Number(c.count)>0?Number(c.count):1}));const id=params.get('tur');if(id){const t=all.find(x=>x.id===id);if(t&&!cart.find(x=>x.id===id))cart.push({id,date:String(t.dates||'').split('•')[0].trim(),count:1});localStorage.setItem('gp_cart',JSON.stringify(cart));history.replaceState({},'',location.pathname)}function price(t){const p=String(t?.price||'');if(/den|başlayan/i.test(p))return 0;const n=Number(p.replace(/[^0-9]/g,''));return Number.isFinite(n)?n:0}function save(){localStorage.setItem('gp_cart',JSON.stringify(cart));render()}function policy(t){return window.getTourPolicy?window.getTourPolicy(t?.id):{child:{mode:'adult'}}}function ageNote(t){const c=policy(t).child||{mode:'adult'};return c.mode==='adult'?'0–6 yaş: Ücretsiz (Koltuksuz) • Diğer yaş grupları: Yetişkin ücreti':`0–6 yaş: Ücretsiz (Koltuksuz) • ${c.label||'Çocuk indirimi'}`}function render(){const el=document.getElementById('cart');if(!cart.length){el.innerHTML='<div class="empty">Sepetiniz henüz boş.<br><br><a class="primary" href="/">Turları İncele</a></div>';return}let total=0;el.innerHTML=cart.map((c,i)=>{const t=all.find(x=>x.id===c.id);if(!t)return'';const dates=String(t.dates||'').split('•').map(x=>x.trim()).filter(Boolean),unit=price(t),qty=Number.isFinite(c.count)?c.count:1;total+=unit*qty;return `<div class="cart-item"><div class="cart-top"><div><div class="cart-title">${t.title}</div><div class="muted">${t.price} / yetişkin</div></div><div class="cart-price">${unit?(unit*qty).toLocaleString('tr-TR')+' TL':'Fiyat teyit edilecek'}</div></div><div class="cart-controls"><div class="control"><label>Tur Tarihi</label><select onchange="setDate(${i},this.value)">${dates.map(d=>`<option value="${d}" ${d===c.date?'selected':''}>${d}</option>`).join('')}</select></div><div class="control"><label>Toplam Yolcu Sayısı</label><select onchange="setCount(${i},this.value)">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${n===qty?'selected':''}>${n} Yolcu</option>`).join('')}</select></div></div><div class="age-note">${ageNote(t)}<br>Çocuk/yaş seçimi rezervasyon ekranında her yolcu için ayrı yapılır ve gerçek ödeme tutarı orada otomatik hesaplanır.</div><button class="remove" onclick="removeItem(${i})">Sepetten Çıkar</button></div>`}).join('')+`<div class="cart-total"><span>Liste Fiyatı Toplamı</span><span>${Number.isFinite(total)?total.toLocaleString('tr-TR'):'0'} TL</span></div><button class="primary checkout" onclick="checkout()">Yolcu Bilgileri ve Ödemeye Geç</button>`}window.setDate=(i,v)=>{cart[i].date=v;save()};window.setCount=(i,v)=>{const n=parseInt(v,10);cart[i].count=Number.isFinite(n)&&n>0?n:1;save()};window.removeItem=i=>{cart.splice(i,1);save()};window.checkout=()=>{const c=cart[0];if(!c)return;location.href=`rezervasyon.html?tur=${encodeURIComponent(c.id)}&tarih=${encodeURIComponent(c.date)}&kisi=${Number.isFinite(c.count)?c.count:1}`};save();render();</script></body></html>
