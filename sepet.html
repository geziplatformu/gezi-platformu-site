<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sepetim | Gezi Platformu</title><link rel="stylesheet" href="legal.css"><style>.cart-item{border:1px solid #dfe6e2;border-radius:14px;padding:16px;margin:12px 0}.cart-top{display:flex;justify-content:space-between;gap:14px}.cart-title{font-weight:900}.cart-price{font-weight:900;white-space:nowrap}.cart-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.cart-controls select{width:auto}.remove{background:#f5ecec;color:#8a2e2e;padding:9px 12px}.cart-total{margin-top:20px;padding:18px;border-radius:14px;background:#f3f8f5;display:flex;justify-content:space-between;font-size:19px;font-weight:900}.empty{text-align:center;padding:35px 10px;color:#66716b}.checkout{width:100%;margin-top:14px;font-size:16px}.cart-link{font-weight:900;text-decoration:none}</style></head><body><header class="legal-header"><div class="legal-header-inner"><a class="legal-brand" href="/">Gezi Platformu</a><a class="legal-home" href="/">← Turlara Dön</a></div></header><main class="legal-wrap"><h1>Sepetim</h1><p class="muted">Tur, tarih ve kişi sayınızı kontrol ederek rezervasyona devam edin.</p><div id="cart"></div></main><script src="tours.js"></script><script src="tours-extra.js"></script><script src="app.js"></script><script>const extra=[{id:'nemrut-rumkale-gaziantep-turu',title:'Nemrut Rumkale Gaziantep Turu',price:'2.000₺',dates:'13 Eylül Pazar • 27 Eylül Pazar'},{id:'sivas-divrigi-turu',title:'Sivas & Divriği Turu',price:'2.499₺',dates:'27 Eylül Pazar'},{id:'hatay-turu',title:'Hatay Turu',price:'1.750₺',dates:'20 Eylül Pazar'}];const all=[...(window.TOURS||[]),...extra];const params=new URLSearchParams(location.search);let cart=JSON.parse(localStorage.getItem('gp_cart')||'[]');const id=params.get('tur');if(id){const t=all.find(x=>x.id===id);if(t){const existing=cart.find(x=>x.id===id);if(!existing)cart.push({id,date:String(t.dates||'').split('•')[0].trim(),count:1});localStorage.setItem('gp_cart',JSON.stringify(cart));history.replaceState({},'',location.pathname)}}function price(t){const p=String(t?.price||'');if(/den|başlayan/i.test(p))return 0;return Number(p.replace(/[^0-9]/g,''))||0}function save(){localStorage.setItem('gp_cart',JSON.stringify(cart));render()}function render(){const el=document.getElementById('cart');if(!cart.length){el.innerHTML='<div class="empty">Sepetiniz henüz boş.<br><br><a class="primary" href="/">Turları İncele</a></div>';return}let total=0;el.innerHTML=cart.map((c,i)=>{const t=all.find(x=>x.id===c.id);if(!t)return'';const dates=String(t.dates||'').split('•').map(x=>x.trim()).filter(Boolean),unit=price(t);total+=unit*c.count;return `<div class="cart-item"><div class="cart-top"><div><div class="cart-title">${t.title}</div><div class="muted">${t.price} / kişi</div></div><div class="cart-price">${unit?(unit*c.count).toLocaleString('tr-TR')+' TL':'Fiyat teyit edilecek'}</div></div><div class="cart-controls"><select onchange="setDate(${i},this.value)">${dates.map(d=>`<option ${d===c.date?'selected':''}>${d}</option>`).join('')}</select><select onchange="setCount(${i},this.value)">${[1,2,3,4,5,6].map(n=>`<option ${n===c.count?'selected':''}>${n} Kişi</option>`).join('')}</select><button class="remove" onclick="removeItem(${i})">Sepetten Çıkar</button></div></div>`}).join('')+`<div class="cart-total"><span>Sepet Toplamı</span><span>${total.toLocaleString('tr-TR')} TL</span></div><button class="primary checkout" onclick="checkout()">Rezervasyona / Ödemeye Geç</button>`}window.setDate=(i,v)=>{cart[i].date=v;save()};window.setCount=(i,v)=>{cart[i].count=Number(v);save()};window.removeItem=i=>{cart.splice(i,1);save()};window.checkout=()=>{const c=cart[0];if(!c)return;localStorage.setItem('gp_checkout',JSON.stringify(c));location.href=`rezervasyon.html?tur=${encodeURIComponent(c.id)}&tarih=${encodeURIComponent(c.date)}&kisi=${c.count}`};render();</script></body></html>
