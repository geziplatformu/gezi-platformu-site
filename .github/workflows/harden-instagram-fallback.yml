name: Harden Instagram fallback

on:
  push:
    paths:
      - '.github/workflows/harden-instagram-fallback.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Instagram section never blank
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('function instagramPost(media){')
          end=s.index('renderTours();updatePhoneTime();', start)
          block=r'''const INSTAGRAM_CACHE_KEY='gezi-instagram-last-good-v1';
function instagramPost(media){const image=media.thumbnail_url||media.media_url;if(!image||!media.permalink)return '';const type=media.media_type==='VIDEO'?'▶':media.media_type==='CAROUSEL_ALBUM'?'▣':'';return `<a class="instagram-post" href="${media.permalink}" target="_blank" rel="noopener" aria-label="Instagram gönderisini görüntüle"><img src="${imageProxy(image)}" alt="Gezi Platformu Instagram paylaşımı" loading="lazy" onerror="this.closest('.instagram-post').classList.add('image-error')">${type?`<span class="instagram-post-type">${type}</span>`:''}</a>`;}
function instagramSafeFallback(){return Array.from({length:9},(_,i)=>`<a class="instagram-post instagram-safe-tile" href="https://www.instagram.com/geziplatformuu/" target="_blank" rel="noopener" aria-label="Gezi Platformu Instagram profilini aç"><img src="assets/gezi-platformu-logo.webp" alt="Gezi Platformu" loading="lazy"><span>${i===4?'@geziplatformuu':'Instagram'}</span></a>`).join('');}
function readInstagramCache(){try{return JSON.parse(localStorage.getItem(INSTAGRAM_CACHE_KEY)||'null')}catch{return null}}
function writeInstagramCache(data){try{localStorage.setItem(INSTAGRAM_CACHE_KEY,JSON.stringify(data))}catch{}}
function renderInstagramData(data,{cached=false}={}){if(!data)return false;if(instagramAvatar&&data.profile_picture_url)instagramAvatar.src=imageProxy(data.profile_picture_url);if(instagramUsername&&data.username)instagramUsername.textContent=data.username;if(instagramName)instagramName.textContent=data.name||'GEZİ PLATFORMU';if(instagramBio&&data.biography)instagramBio.textContent=data.biography;if(instagramPostCount&&data.media_count!=null)instagramPostCount.textContent=exactNumber.format(data.media_count);if(instagramFollowerCount&&data.followers_count!=null){instagramFollowerCount.textContent=compactNumber.format(data.followers_count);instagramFollowerCount.title=exactNumber.format(data.followers_count);}if(instagramFollowingCount&&data.follows_count!=null)instagramFollowingCount.textContent=exactNumber.format(data.follows_count);const posts=[...(data.media||[])].sort((a,b)=>new Date(b.timestamp||0)-new Date(a.timestamp||0)).slice(0,9).map(instagramPost).filter(Boolean);if(instagramFeed&&posts.length)instagramFeed.innerHTML=posts.join('');if(instagramStatus){instagramStatus.textContent=cached?'Son başarılı Instagram verisi':data.source==='official'?`Canlı Instagram profili • ${new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}`:data.source==='public'?`Instagram profili güncellendi • ${new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}`:'Instagram profilimiz';instagramStatus.className='instagram-status ready';}return posts.length>0||Boolean(data.username)}
function ensureInstagramNeverBlank(){if(!instagramFeed)return;const hasReal=instagramFeed.querySelector('.instagram-post');if(!hasReal)instagramFeed.innerHTML=instagramSafeFallback();if(instagramStatus&&!instagramStatus.textContent.trim()){instagramStatus.textContent='Instagram profilimiz';instagramStatus.className='instagram-status ready';}}
async function loadInstagram(){try{const response=await fetch('/api/instagram',{cache:'no-store'});const data=await response.json();if(!response.ok||!data.username)throw new Error(data.error||'Instagram verileri alınamadı');const useful=(Array.isArray(data.media)&&data.media.length)||data.followers_count!=null||data.profile_picture_url;if(useful){renderInstagramData(data);writeInstagramCache(data);}else{const cached=readInstagramCache();if(cached)renderInstagramData(cached,{cached:true});ensureInstagramNeverBlank();}}catch(error){const cached=readInstagramCache();if(cached)renderInstagramData(cached,{cached:true});ensureInstagramNeverBlank();}}
const cachedInstagram=readInstagramCache();if(cachedInstagram)renderInstagramData(cachedInstagram,{cached:true});else ensureInstagramNeverBlank();
'''
          s=s[:start]+block+s[end:]
          p.write_text(s,encoding='utf-8')

          css=Path('styles.css')
          c=css.read_text(encoding='utf-8')
          if '.instagram-safe-tile{' not in c:
              c+='''\n.instagram-safe-tile{position:relative;display:grid;place-items:center;background:linear-gradient(145deg,#f5f1ff,#fff0f5 52%,#fff8ee);color:#8a3ab9;text-align:center}.instagram-safe-tile img{width:54%;height:54%;object-fit:contain;opacity:.92}.instagram-safe-tile span{position:absolute;left:4px;right:4px;bottom:6px;font-size:8px;font-weight:900;color:#6f4b77;text-shadow:0 1px 0 #fff}.instagram-post.image-error{display:grid;place-items:center;background:center/58% no-repeat url('assets/gezi-platformu-logo.webp'),linear-gradient(145deg,#f5f1ff,#fff0f5 52%,#fff8ee)}.instagram-post.image-error img{display:none}\n'''
              css.write_text(c,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "geziplatformu"
          git config user.email "futbolsovu@gmail.com"
          if git diff --quiet; then exit 0; fi
          git add app.js styles.css
          git commit -m "Keep Instagram section filled when live data fails"
          git push
