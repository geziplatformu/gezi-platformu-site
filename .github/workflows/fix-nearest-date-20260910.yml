name: Fix nearest tour date strict future
on:
  push:
    paths:
      - '.github/workflows/fix-nearest-date-20260910.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix nearest-date cutoff
        shell: python
        run: |
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace('for(let i=0;i<370;i++){const d=new Date(today);', 'for(let i=1;i<370;i++){const d=new Date(today);')
          s=s.replace('.filter(x=>x.date>=today).sort((a,b)=>a.date-b.date)', '.filter(x=>x.date>today).sort((a,b)=>a.date-b.date)')
          if s==old:
              raise SystemExit('Expected nearest-date patterns were not found')
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "geziplatformu"
          git config user.email "futbolsovu@gmail.com"
          git add app-core.js
          git commit -m "Use only dates after today for nearest tour date"
          git push
