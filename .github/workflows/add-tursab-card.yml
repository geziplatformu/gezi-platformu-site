name: Add TURSAB footer card

on:
  push:
    paths:
      - '.github/workflows/add-tursab-card.yml'

permissions:
  contents: write

jobs:
  update-footer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add TURSAB membership card
        shell: python
        run: |
          from pathlib import Path
          index = Path('index.html')
          css = Path('styles.css')
          html = index.read_text(encoding='utf-8')
          marker = '<div class="tursab-membership-card"'
          if marker not in html:
              old = '</main><footer class="site-footer">'
              card = '''</main><section class="tursab-membership-wrap" aria-label="TÜRSAB üyelik bilgileri"><div class="tursab-membership-card"><div class="tursab-membership-emblem" aria-hidden="true">✓</div><div class="tursab-membership-copy"><span>TÜRSAB ÜYESİ SEYAHAT ACENTASI</span><strong>ÖZBEK TURİZM</strong><small>Türkiye Seyahat Acentaları Birliği • Belge No: A-8660</small></div><a class="tursab-membership-button" href="https://online.tursab.org.tr/publicpages/embedded/agencysearch/" target="_blank" rel="noopener">TÜRSAB’da Acenta Sorgula ↗</a></div></section><footer class="site-footer">'''
              if old not in html:
                  raise SystemExit('Footer marker not found; no changes made.')
              html = html.replace(old, card, 1)
              index.write_text(html, encoding='utf-8')
          styles = css.read_text(encoding='utf-8')
          if '.tursab-membership-wrap{' not in styles:
              styles += '''\n.tursab-membership-wrap{padding:24px 14px 12px;background:#fff;border-top:1px solid var(--line)}.tursab-membership-card{width:min(760px,100%);margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:18px;border:1px solid #dfe4e6;border-radius:18px;background:linear-gradient(180deg,#fff,#f7f9f8);box-shadow:0 10px 30px rgba(26,42,49,.08)}.tursab-membership-emblem{width:46px;height:46px;display:grid;place-items:center;border-radius:50%;background:#08783f;color:#fff;font-size:24px;font-weight:950;box-shadow:inset 0 0 0 4px rgba(255,255,255,.22)}.tursab-membership-copy{display:grid;gap:3px;min-width:0}.tursab-membership-copy span{color:#08783f;font-size:10px;font-weight:950;letter-spacing:.09em}.tursab-membership-copy strong{font-size:20px;line-height:1.1;letter-spacing:-.02em}.tursab-membership-copy small{color:#657078;font-size:11px;line-height:1.4}.tursab-membership-button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:999px;background:#152025;color:#fff;font-size:11px;font-weight:900;white-space:nowrap}.tursab-membership-button:active{transform:scale(.97)}@media(max-width:640px){.tursab-membership-wrap{padding:18px 14px 10px}.tursab-membership-card{grid-template-columns:auto 1fr;padding:14px;gap:10px}.tursab-membership-emblem{width:40px;height:40px;font-size:20px}.tursab-membership-copy strong{font-size:17px}.tursab-membership-copy small{font-size:10px}.tursab-membership-button{grid-column:1/-1;width:100%;margin-top:4px}}\n'''
              css.write_text(styles, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "geziplatformu"
          git config user.email "futbolsovu@gmail.com"
          if git diff --quiet; then exit 0; fi
          git add index.html styles.css
          git commit -m "Add TÜRSAB membership verification card"
          git push
