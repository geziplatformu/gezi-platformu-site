name: Notify search engines after production deployment
on:
  deployment_status:
permissions:
  contents: read
concurrency:
  group: indexnow-production
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.event.deployment_status.state == 'success' &&
      (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.deployment.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify production ancestry
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Notify changed public URLs
        run: node scripts/submit-indexnow.mjs
