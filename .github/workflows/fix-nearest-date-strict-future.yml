name: Fix nearest tour date strict future
on:
  push:
    paths:
      - '.github/workflows/fix-nearest-date-strict-future.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make nearest date strictly future
        shell: python
        run: |
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text(encoding='utf-8')
          old1="for(let i=0;i<370;i++){const d=new Date(today);d.setDate(today.getDate()+i);"
          new1="for(let i=1;i<370;i++){const d=new Date(today);d.setDate(today.getDate()+i);"
          old2=".filter(Boolean).filter(x=>x.date>=today).sort((a,b)=>a.date-b.date);"
          new2=".filter(Boolean).filter(x=>x.date>today).sort((a,b)=>a.date-b.date);"
          if old1 not in s:
              raise SystemExit('Recurring-date pattern not found')
          if old2 not in s:
              raise SystemExit('Explicit-date pattern not found')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "geziplatformu"
          git config user.email "futbolsovu@gmail.com"
          git add app-core.js
          git commit -m "Use only future dates for nearest tour date"
          git push
