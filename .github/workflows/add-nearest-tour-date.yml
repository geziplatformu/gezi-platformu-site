name: Add automatic nearest tour dates

on:
  push:
    paths:
      - '.github/workflows/add-nearest-tour-date.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add dynamic nearest date logic
        shell: python
        run: |
          from pathlib import Path
          app=Path('app.js')
          s=app.read_text(encoding='utf-8')
          anchor="function coverLabels(t){\n  if(t.id==='dogu-ekspresi-erzurum-kars-agri-van')return {badge:'Konaklamalı',type:'4 Gece 4 Gün'};\n  if(isOvernight(t))return {badge:'Konaklamalı',type:t.duration||t.type};\n  return {badge:t.badge,type:t.type};\n}\n"
          logic=r'''function trDateStartOfDay(date=new Date()){return new Date(date.getFullYear(),date.getMonth(),date.getDate());}
const trMonths={ocak:0,şubat:1,subat:1,mart:2,nisan:3,mayıs:4,mayis:4,haziran:5,temmuz:6,ağustos:7,agustos:7,eylül:8,eylul:8,ekim:9,kasım:10,kasim:10,aralık:11,aralik:11};
const trMonthNames=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const trWeekdays={pazar:0,pazartesi:1,salı:2,sali:2,çarşamba:3,carsamba:3,perşembe:4,persembe:4,cuma:5,cumartesi:6};
function normTr(v=''){return String(v).toLocaleLowerCase('tr-TR').replace(/[()]/g,' ').replace(/\s+/g,' ').trim();}
function yearForMonth(month,today){const y=today.getFullYear(),cm=today.getMonth();if(month<cm-1)return y+1;return y;}
function explicitNearestDate(text,today){
  const parts=String(text||'').split('•').map(x=>x.trim()).filter(Boolean),candidates=[];
  for(const original of parts){
    const clean=normTr(original).replace(/ara tatil/g,'').replace(/yılbaşı özel/g,'').replace(/yilbasi ozel/g,'').trim();
    let m=clean.match(/^(\d{1,2})\s*[–-]\s*(\d{1,2})\s+([a-zçğıöşü]+)/i);
    if(m){const day=Number(m[1]),month=trMonths[normTr(m[3])];if(month!==undefined){let year=yearForMonth(month,today);let d=new Date(year,month,day);if(d<today){year++;d=new Date(year,month,day);}candidates.push({date:d,label:original});continue;}}
    m=clean.match(/^(\d{1,2})\s+([a-zçğıöşü]+)/i);
    if(m){const day=Number(m[1]),month=trMonths[normTr(m[2])];if(month!==undefined){let year=yearForMonth(month,today);let d=new Date(year,month,day);if(d<today){year++;d=new Date(year,month,day);}candidates.push({date:d,label:original});}}
  }
  candidates.sort((a,b)=>a.date-b.date);return candidates[0]||null;
}
function recurringNearestDate(text,today){
  const n=normTr(text);if(!n.includes('her '))return null;
  const months=Object.entries(trMonths).filter(([name])=>n.includes(name)).map(([,num])=>num).filter((v,i,a)=>a.indexOf(v)===i);
  const weekdays=Object.entries(trWeekdays).filter(([name])=>n.includes(name)).map(([,num])=>num).filter((v,i,a)=>a.indexOf(v)===i);
  if(!months.length||!weekdays.length)return null;
  for(let i=0;i<400;i++){const d=new Date(today);d.setDate(today.getDate()+i);if(months.includes(d.getMonth())&&weekdays.includes(d.getDay()))return {date:d,label:`${d.getDate()} ${trMonthNames[d.getMonth()]}`};}
  return null;
}
function nearestTourDate(t){const today=trDateStartOfDay();const recurring=recurringNearestDate(t.dates,today);const explicit=explicitNearestDate(t.dates,today);const best=[recurring,explicit].filter(Boolean).sort((a,b)=>a.date-b.date)[0];return best?best.label:'Tarih sorunuz';}
'''
          if 'function nearestTourDate(t)' not in s:
              if anchor not in s: raise SystemExit('coverLabels anchor not found')
              s=s.replace(anchor,anchor+logic,1)
          old="const detailAction=t.detailUrl?`<a class=\"button\" href=\"${t.detailUrl}\">Tur Detayları</a>`:`<button class=\"button\" data-tour=\"${t.id}\">Tur Detayları</button>`;const startingPrice="
          new="const detailAction=t.detailUrl?`<a class=\"button\" href=\"${t.detailUrl}\">Tur Detayları</a>`:`<button class=\"button\" data-tour=\"${t.id}\">Tur Detayları</button>`;const nearestDate=`<span class=\"nearest-tour-date\"><small>En Yakın Tarih</small><strong>${nearestTourDate(t)}</strong></span>`;const startingPrice="
          if 'class=\"nearest-tour-date\"' not in s:
              if old not in s: raise SystemExit('detailAction anchor not found')
              s=s.replace(old,new,1)
          old2='<div class="tour-actions">${detailAction}</div>'
          new2='<div class="tour-actions">${detailAction}${nearestDate}</div>'
          if old2 in s:s=s.replace(old2,new2,1)
          app.write_text(s,encoding='utf-8')

          css=Path('styles.css');c=css.read_text(encoding='utf-8')
          if '.nearest-tour-date{' not in c:
              c+='''\n.nearest-tour-date{min-height:46px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;padding:7px 10px;border-radius:12px;background:var(--soft);color:var(--muted);line-height:1.12}.nearest-tour-date small{font-size:8px;font-weight:850;text-transform:uppercase;letter-spacing:.04em}.nearest-tour-date strong{margin-top:3px;color:var(--green);font-size:11px;font-weight:950}@media(max-width:480px){.tour-actions{grid-template-columns:1fr 1fr}.nearest-tour-date{padding:6px 8px}.nearest-tour-date small{font-size:7.5px}.nearest-tour-date strong{font-size:10px}}\n'''
              css.write_text(c,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "geziplatformu"
          git config user.email "futbolsovu@gmail.com"
          if git diff --quiet; then exit 0; fi
          git add app.js styles.css
          git commit -m "Show automatic nearest date on every tour card"
          git push
