name: Fix nearest tour date
on:
  push:
    paths:
      - '.github/workflows/fix-nearest-tour-date.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep today and future tour dates
        shell: python
        run: |
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace("for(let i=1;i<370;i++){const d=new Date(today);d.setDate(today.getDate()+i);", "for(let i=0;i<370;i++){const d=new Date(today);d.setDate(today.getDate()+i);", 1)
          s=s.replace(".filter(Boolean).filter(x=>x.date>today).sort((a,b)=>a.date-b.date);", ".filter(Boolean).filter(x=>x.date>=today).sort((a,b)=>a.date-b.date);", 1)
          if s==old:
              print('Nearest-date logic already includes today; no code change needed')
          else:
              p.write_text(s,encoding='utf-8')
      - name: Commit fix if needed
        run: |
          git config user.name "geziplatformu"
          git config user.email "futbolsovu@gmail.com"
          git add app-core.js
          if git diff --cached --quiet; then
            echo "No app-core.js change needed"
          else
            git commit -m "Include today in nearest tour dates"
            git push
          fi
