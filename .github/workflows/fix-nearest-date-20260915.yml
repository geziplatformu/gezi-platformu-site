name: Fix nearest tour date calculation
on:
  push:
    paths:
      - '.github/workflows/fix-nearest-date-20260915.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch nearest date logic
        shell: python
        run: |
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text(encoding='utf-8')
          old="function nextRecurringDate(text,today){const n=norm(text);if(!/boyunca her/.test(n))return null;const words=n.split(/[^a-zçğıöşü]+/i).filter(Boolean);const activeMonths=[...new Set(Object.entries(monthMap).filter(([name])=>words.includes(name)).map(([,idx])=>idx))];const weekdays=[...new Set(Object.entries(weekdayMap).filter(([name])=>words.includes(name)).map(([,idx])=>idx))];if(!activeMonths.length||!weekdays.length)return null;for(let i=0;i<370;i++){const d=new Date(today);d.setDate(today.getDate()+i);if(activeMonths.includes(d.getMonth())&&weekdays.includes(d.getDay()))return {date:d,label:new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'long',weekday:'long'}).format(d)};}return null;}"
          new="function nextRecurringDate(text,today){const n=norm(text);if(!/boyunca her/.test(n))return null;const words=n.split(/[^a-zçğıöşü]+/i).filter(Boolean);let activeMonths=[...new Set(Object.entries(monthMap).filter(([name])=>words.includes(name)).map(([,idx])=>idx))];const monthNames=Object.keys(monthMap).sort((a,b)=>b.length-a.length).join('|');const range=n.match(new RegExp(`(${monthNames})\\s*[-–]\\s*(${monthNames})\\s+boyunca`,'i'));if(range){const start=monthMap[norm(range[1])],end=monthMap[norm(range[2])];activeMonths=[];for(let m=start;;m=(m+1)%12){activeMonths.push(m);if(m===end)break;if(activeMonths.length>12)break;}}const weekdays=[...new Set(Object.entries(weekdayMap).filter(([name])=>words.includes(name)).map(([,idx])=>idx))];if(!activeMonths.length||!weekdays.length)return null;for(let i=1;i<370;i++){const d=new Date(today);d.setDate(today.getDate()+i);if(activeMonths.includes(d.getMonth())&&weekdays.includes(d.getDay()))return {date:d,label:new Intl.DateTimeFormat('tr-TR',{day:'2-digit',month:'long',weekday:'long'}).format(d)};}return null;}"
          if old not in s:
              raise SystemExit('Recurring-date function signature did not match; refusing unsafe patch')
          s=s.replace(old,new,1)
          old2=".filter(Boolean).filter(x=>x.date>=today).sort((a,b)=>a.date-b.date)"
          new2=".filter(Boolean).filter(x=>x.date>today).sort((a,b)=>a.date-b.date)"
          if old2 not in s:
              raise SystemExit('Explicit-date filter signature did not match; refusing unsafe patch')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "geziplatformu"
          git config user.email "futbolsovu@gmail.com"
          git add app-core.js
          git commit -m "Fix nearest future tour date calculation"
          git push
