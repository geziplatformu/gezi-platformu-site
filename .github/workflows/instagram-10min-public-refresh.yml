name: Instagram public refresh every 10 minutes

on:
  push:
    paths:
      - '.github/workflows/instagram-10min-public-refresh.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Instagram refresh intervals
        shell: python
        run: |
          from pathlib import Path
          api=Path('api/instagram.js')
          s=api.read_text(encoding='utf-8')
          s=s.replace('const PUBLIC_RETRY_MS=15*60*1000;','const PUBLIC_RETRY_MS=10*60*1000;')
          s=s.replace("response.setHeader('Cache-Control','public, max-age=300, s-maxage=900, stale-while-revalidate=86400');","response.setHeader('Cache-Control','public, max-age=60, s-maxage=600, stale-while-revalidate=86400');")
          api.write_text(s,encoding='utf-8')

          app=Path('app.js')
          a=app.read_text(encoding='utf-8')
          a=a.replace('setInterval(loadInstagram,900000);','setInterval(loadInstagram,600000);')
          app.write_text(a,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "geziplatformu"
          git config user.email "futbolsovu@gmail.com"
          if git diff --quiet; then exit 0; fi
          git add api/instagram.js app.js
          git commit -m "Refresh public Instagram data every 10 minutes"
          git push
