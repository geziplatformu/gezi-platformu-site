name: Attach Instagram resilience
on:
  push:
    paths:
      - '.github/workflows/attach-instagram-resilience.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attach script and fallback styles
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          tag='<script src="instagram-resilience.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>',f'  {tag}\n</body>')
              p.write_text(s,encoding='utf-8')
          c=Path('styles.css');x=c.read_text(encoding='utf-8')
          if '.instagram-resilience-tile{' not in x:
              x+='''\n.instagram-resilience-tile{position:relative;display:grid!important;place-items:center;background:linear-gradient(145deg,#f6f1ff,#fff0f6 52%,#fff8ee);text-decoration:none;overflow:hidden}.instagram-resilience-tile img{width:56%!important;height:56%!important;object-fit:contain!important;opacity:.94}.instagram-resilience-tile span{position:absolute;left:3px;right:3px;bottom:5px;text-align:center;font-size:8px;font-weight:900;color:#734b7d;background:rgba(255,255,255,.72);border-radius:7px;padding:2px 3px}\n'''
              c.write_text(x,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "geziplatformu"
          git config user.email "futbolsovu@gmail.com"
          if git diff --quiet; then exit 0; fi
          git add index.html styles.css
          git commit -m "Always show filled Instagram fallback on homepage"
          git push
