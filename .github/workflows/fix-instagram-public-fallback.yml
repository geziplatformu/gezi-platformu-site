name: Fix Instagram public fallback
on:
  push:
    paths: ['.github/workflows/fix-instagram-public-fallback.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Improve Instagram fallback
        shell: python
        run: |
          from pathlib import Path
          p=Path('api/instagram.js')
          s=p.read_text(encoding='utf-8')
          marker='async function fetchPublicProfile(){'
          html_func=r'''async function fetchPublicHtmlProfile(){
  try{
    const result=await fetch(PROFILE_URL,{headers:{Accept:'text/html,application/xhtml+xml','Accept-Language':'tr-TR,tr;q=0.9,en;q=0.8','User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/131 Mobile Safari/537.36'},signal:AbortSignal.timeout(8000)});
    if(!result.ok)return null;
    const html=await result.text();
    const desc=(html.match(/<meta[^>]+(?:property|name)=["'](?:og:description|description)["'][^>]+content=["']([^"']+)["']/i)||html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+(?:property|name)=["'](?:og:description|description)["']/i)||[])[1]||'';
    const img=(html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i)||[])[1]||'';
    const followers=(desc.match(/([\d.,]+)\s+(?:Followers|takipçi)/i)||[])[1];
    const following=(desc.match(/([\d.,]+)\s+(?:Following|takip)/i)||[])[1];
    const posts=(desc.match(/([\d.,]+)\s+(?:Posts|gönderi)/i)||[])[1];
    const parseCount=v=>{if(!v)return null;const raw=String(v).trim();if(/^\d{1,3}([.,]\d{3})+$/.test(raw))return Number(raw.replace(/[.,]/g,''));return Number(raw.replace(',','.'))||null;};
    const payload=fallbackPayload();
    payload.profile_picture_url=img.replace(/&amp;/g,'&');
    payload.followers_count=parseCount(followers);
    payload.follows_count=parseCount(following);
    payload.media_count=parseCount(posts);
    payload.source='public-html';
    return (payload.followers_count!=null||payload.media_count!=null||payload.profile_picture_url)?payload:null;
  }catch{return null;}
}

'''
          if 'async function fetchPublicHtmlProfile()' not in s:
              s=s.replace(marker,html_func+marker,1)
          old="  if(!payload){\n    try{payload=await fetchPublicProfile();}catch{}\n  }"
          new="  if(!payload){\n    try{payload=await fetchPublicProfile();}catch{}\n  }\n  if(!payload){\n    try{payload=await fetchPublicHtmlProfile();}catch{}\n  }"
          if 'payload=await fetchPublicHtmlProfile()' not in s:
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          app=Path('app.js');a=app.read_text(encoding='utf-8')
          oldfeed="if(instagramFeed)instagramFeed.innerHTML=posts.length?posts.join(''):'<div style=\"grid-column:1/-1;padding:22px 12px;font-size:12px;color:#666\">Güncel paylaşımlarımızı Instagram profilimizden görüntüleyebilirsiniz.</div>';"
          fallback="if(instagramFeed)instagramFeed.innerHTML=posts.length?posts.join(''):Array.from({length:9},(_,i)=>`<a class=\"instagram-post instagram-safe-tile\" href=\"https://www.instagram.com/geziplatformuu/\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/gezi-platformu-logo.webp\" alt=\"Gezi Platformu Instagram\"><span>${i===4?'@geziplatformuu':'Instagram'}</span></a>`).join('');"
          a=a.replace(oldfeed,fallback)
          oldcatch="if(instagramFeed)instagramFeed.innerHTML='<div style=\"grid-column:1/-1;padding:22px 12px;font-size:12px;color:#666\">Güncel paylaşımlarımızı Instagram profilimizden görüntüleyebilirsiniz.</div>';"
          catchfb="if(instagramFeed)instagramFeed.innerHTML=Array.from({length:9},(_,i)=>`<a class=\"instagram-post instagram-safe-tile\" href=\"https://www.instagram.com/geziplatformuu/\" target=\"_blank\" rel=\"noopener\"><img src=\"assets/gezi-platformu-logo.webp\" alt=\"Gezi Platformu Instagram\"><span>${i===4?'@geziplatformuu':'Instagram'}</span></a>`).join('');"
          a=a.replace(oldcatch,catchfb)
          app.write_text(a,encoding='utf-8')

          css=Path('styles.css');c=css.read_text(encoding='utf-8')
          if '.instagram-safe-tile{' not in c:
              c+='\n.instagram-safe-tile{position:relative;display:grid;place-items:center;background:linear-gradient(145deg,#f5f1ff,#fff0f5 52%,#fff8ee);color:#8a3ab9;text-align:center}.instagram-safe-tile img{width:56%;height:56%;object-fit:contain}.instagram-safe-tile span{position:absolute;left:3px;right:3px;bottom:5px;font-size:8px;font-weight:900;color:#6f4b77}\n'
              css.write_text(c,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'geziplatformu'
          git config user.email 'futbolsovu@gmail.com'
          if git diff --quiet; then exit 0; fi
          git add api/instagram.js app.js styles.css
          git commit -m 'Use public Instagram HTML fallback and never blank feed'
          git push
