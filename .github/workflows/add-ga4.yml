name: Install GA4
on:
  push:
    paths:
      - '.github/workflows/add-ga4.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add GA4 to HTML pages
        shell: python
        run: |
          from pathlib import Path
          mid='G-SL0GWRTHRR'
          snippet=f'''  <!-- Google tag (gtag.js) -->\n  <script async src="https://www.googletagmanager.com/gtag/js?id={mid}"></script>\n  <script>\n    window.dataLayer = window.dataLayer || [];\n    function gtag(){{dataLayer.push(arguments);}}\n    gtag('js', new Date());\n    gtag('config', '{mid}');\n  </script>\n'''
          changed=[]
          for p in Path('.').rglob('*.html'):
              if any(part in {'.git','node_modules'} for part in p.parts): continue
              s=p.read_text(encoding='utf-8')
              if mid in s: continue
              if '</head>' in s:
                  p.write_text(s.replace('</head>',snippet+'</head>',1),encoding='utf-8')
                  changed.append(str(p))
          print('Updated:', ', '.join(changed) or 'none')
      - name: Commit
        run: |
          git config user.name "geziplatformu"
          git config user.email "futbolsovu@gmail.com"
          if git diff --quiet; then exit 0; fi
          git add '*.html' || true
          git add .
          git reset .github/workflows/add-ga4.yml
          git commit -m "Install Google Analytics 4 tracking"
          git push
