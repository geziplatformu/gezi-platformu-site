name: Keep departure cities on one mobile line

on:
  push:
    paths:
      - '.github/workflows/mobile-departure-line.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update only homepage departure eyebrow on mobile
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<p class="eyebrow">Mersin • Adana • Niğde • Konya • Aksaray • Nevşehir</p>'
          new='<p class="eyebrow departure-cities">Mersin • Adana • Niğde • Konya • Aksaray • Nevşehir</p>'
          if old in s:
              s=s.replace(old,new,1)
          marker='@media(max-width:480px){.site-header'
          rule='@media(max-width:480px){.departure-cities{white-space:nowrap;font-size:clamp(7.4px,2.45vw,10px);letter-spacing:.035em}}\n    '
          if '.departure-cities{white-space:nowrap' not in s:
              if marker not in s: raise SystemExit('Mobile style marker not found')
              s=s.replace(marker,rule+marker,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "geziplatformu"
          git config user.email "futbolsovu@gmail.com"
          if git diff --quiet; then exit 0; fi
          git add index.html
          git commit -m "Keep departure cities on one line on mobile"
          git push
