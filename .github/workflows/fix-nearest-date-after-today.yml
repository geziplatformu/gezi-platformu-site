name: Fix nearest tour date cutoff
on:
  push:
    paths:
      - '.github/workflows/fix-nearest-date-after-today.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require nearest dates to be after today
        shell: python
        run: |
          from pathlib import Path
          p=Path('app-core.js')
          s=p.read_text(encoding='utf-8')
          old1="for(let i=0;i<370;i++){const d=new Date(today);"
          new1="for(let i=1;i<370;i++){const d=new Date(today);"
          old2=".filter(x=>x.date>=today).sort((a,b)=>a.date-b.date)"
          new2=".filter(x=>x.date>today).sort((a,b)=>a.date-b.date)"
          if old1 not in s: raise SystemExit('Recurring date pattern not found')
          if old2 not in s: raise SystemExit('Explicit date cutoff pattern not found')
          s=s.replace(old1,new1,1).replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit and push
        run: |
          git config user.name "geziplatformu"
          git config user.email "futbolsovu@gmail.com"
          git add app-core.js
          git commit -m "Show only future dates in nearest tour date" || exit 0
          git push
