<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Gezi Platformu Yönetim Girişi</title><style>:root{font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#17202a}.box{width:min(92vw,390px);background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:26px;box-shadow:0 12px 40px #10182814}h1{font-size:22px;margin:0 0 6px}p{color:#667085;font-size:13px;margin:0 0 20px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:15px}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#1f2937;color:#fff;font-weight:800;cursor:pointer}.err{color:#b42318;font-size:13px;margin-top:12px;display:none}</style></head><body><form class="box" id="login"><h1>Analytics Yönetim Paneli</h1><p>Devam etmek için yönetici girişi yapın.</p><label>Kullanıcı adı</label><input id="u" autocomplete="username" required><label>Şifre</label><input id="p" type="password" autocomplete="current-password" required><button>Giriş Yap</button><div class="err" id="err">Kullanıcı adı veya şifre hatalı.</div></form><script>const H='c45ddf4034ffcac230174998b1d37a92aa03157ac6528ca1479b57af14cf57f7';async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}document.getElementById('login').addEventListener('submit',async e=>{e.preventDefault();const v=document.getElementById('u').value+':'+document.getElementById('p').value;if(await sha(v)===H){sessionStorage.setItem('gp_admin_ok','1');location.replace('/admin/analytics/panel.html')}else document.getElementById('err').style.display='block'});</script></body></html>
