<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1f2937"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Gezi Analytics"><link rel="manifest" href="/admin/analytics/manifest.webmanifest?v=1"><link rel="apple-touch-icon" href="/favicon-192.png?v=20260821"><title>Gezi Platformu Yönetim Girişi</title><style>:root{font-family:Inter,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;color:#17202a}.box{width:min(92vw,390px);background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:26px;box-shadow:0 12px 40px #10182814}h1{font-size:22px;margin:0 0 6px}p{color:#667085;font-size:13px;margin:0 0 20px}label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}input{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}button{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:#1f2937;color:#fff;font-weight:800;cursor:pointer}.secondary{margin-top:10px;background:#e8edf1;color:#26313b}.install-note{margin:13px 0 0;font-size:12px;line-height:1.45;text-align:center}.err{color:#b42318;font-size:13px;margin-top:12px;display:none}.checking{text-align:center;color:#667085;font-size:13px}</style></head><body><form class="box" id="login" hidden><h1>Analytics Yönetim Paneli</h1><p>Bu cihazda bir kez giriş yapmanız yeterli. Oturum 30 gün boyunca güvenli biçimde korunur.</p><label>Kullanıcı adı</label><input id="u" autocomplete="username" required><label>Şifre</label><input id="p" type="password" autocomplete="current-password" required><button>Giriş Yap</button><button class="secondary" id="install" type="button">Telefon Ana Ekranına Ekle</button><p class="install-note" id="installNote" hidden></p><div class="err" id="err">Kullanıcı adı veya şifre hatalı.</div></form><div class="checking" id="checking">Oturum kontrol ediliyor…</div><script>const form=document.getElementById('login'),err=document.getElementById('err'),checking=document.getElementById('checking'),install=document.getElementById('install'),installNote=document.getElementById('installNote');let deferredPrompt=null;function showInstallNote(message){installNote.textContent=message;installNote.hidden=false}window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredPrompt=event;install.hidden=false});install.addEventListener('click',async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;return}showInstallNote('Tarayıcı menüsünden “Ana ekrana ekle” seçeneğini kullanın. Eklenen Gezi Analytics simgesi doğrudan bu panele açılır.')});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js?v=2').catch(()=>{});async function boot(){try{const r=await fetch('/api/admin-login',{cache:'no-store'}),d=await r.json();if(d.authenticated){location.replace('/admin/analytics/panel.html');return}}catch{}checking.hidden=true;form.hidden=false}form.addEventListener('submit',async e=>{e.preventDefault();err.style.display='none';const auth=btoa(unescape(encodeURIComponent(document.getElementById('u').value+':'+document.getElementById('p').value)));try{const r=await fetch('/api/admin-login',{method:'POST',headers:{Authorization:'Basic '+auth},cache:'no-store'});if(r.status===401){err.textContent='Kullanıcı adı veya şifre hatalı.';err.style.display='block';return}const d=await r.json();if(!r.ok||!d.authenticated)throw new Error();location.replace('/admin/analytics/panel.html')}catch{err.textContent='Giriş doğrulanamadı. Lütfen tekrar deneyin.';err.style.display='block'}});boot();</script></body></html>
